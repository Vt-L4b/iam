                    src="https://www.arquidiocesedefortaleza.org.br/wp-content/uploads/2024/02/formato-do-site-iam.jpg"
                    class="w-full h-full object-contain" alt="Destaque 1"></div>
            <div class="flex-shrink-0 w-full h-[300px] snap-start"><img
                    src="https://www.paieterno.com.br/wp-content/uploads/2023/03/infancia_e_adolescencia_missionaria_180_anos.jpg"

            </button>
            <button type="button"

    </main>

    <footer class="bg-gray-300 text-gray-600 py-6 mt-12">
        <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 text-center md:text-left">

            <!-- Coluna 1: Imagens -->
            <div class="flex flex-col items-center gap-2">
                <img src="https://app.pom.org.br/static/media/Logo_vertical_laranja.b8b0d44a.png" alt="Logo"
                    class="w-20 h-auto" />
                <img src="https://uniao.pom.org.br/wp-content/uploads/sites/6/2020/10/Logo-IAM-2019-Vertical.png"
                    alt="Imagem 2" class="w-16 h-auto" />
            </div>

            <!-- Coluna 2: Contato -->

                <h3 class="font-semibold text-lg">Contato</h3>
                <p>Email: <a href="mailto:contato@exemplo.com" class="underline">contato@exemplo.com</a></p>
                <p>Telefone: (31) 99999-9999</p>
            </div>

            <!-- Coluna 3: Copyright -->

                <span class="text-sm text-gray-400">© 2025 Infância e Adolescência Missionária</span>
                <span class="text-sm text-gray-400">Todos os direitos reservados</span>
            </div>

        </div>
    </footer>

    <script>
        // Menu mobile
        const seeMenu = document.getElementById('menu');
        const theMenu = document.getElementById('mobile-menu');
        const menuOverlay = document.getElementById('menu-overlay');

        function openMenu() {
            theMenu.classList.remove('translate-x-full');
            menuOverlay.classList.remove('hidden');
            seeMenu.setAttribute('aria-expanded', 'true');
        }

        function closeMenu() {
            theMenu.classList.add('translate-x-full');
            menuOverlay.classList.add('hidden');
            seeMenu.setAttribute('aria-expanded', 'false');
        }

        seeMenu.addEventListener('click', openMenu);
        document.getElementById('menu-close').addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);
        theMenu.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));

        // Lightbox
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxDesc = document.getElementById('lightbox-desc');

        function openLightbox(img) {
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
            lightboxDesc.textContent = img.getAttribute('data-description');
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
        }

        function closeLightbox() {
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
        }

        document.querySelectorAll('.thumbnail').forEach(card => {
            card.addEventListener('click', () => openLightbox(card.querySelector('img')));
        });

        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);

        // Fecha ao clicar no fundo escuro (fora da caixa branca)
        lightbox.addEventListener('click', event => {
            if (event.target === lightbox) closeLightbox();
        });

        // Esc fecha o que estiver aberto
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeLightbox();
                closeMenu();
            }
        });
    </script>

</body>

</html>
